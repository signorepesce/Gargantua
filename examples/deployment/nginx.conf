limit_req_zone $binary_remote_addr zone=gargantua_requests:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=gargantua_connections:10m;

server
{
    listen 443 ssl;
    server_name api.example.com;
    ssl_certificate /etc/letsencrypt/live/api.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    client_max_body_size 7m;
    client_header_timeout 5s;
    client_body_timeout 10s;
    keepalive_timeout 15s;
    limit_req zone=gargantua_requests burst=20 nodelay;
    limit_req_status 429;
    limit_conn gargantua_connections 16;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location /health/ { return 404; }
    location = /openapi.json { return 404; }

    location /
    {
        proxy_pass http://127.0.0.1:8100;
        proxy_http_version 1.1;
        proxy_set_header Connection close;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Forwarded "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_request_buffering on;
        proxy_buffering on;
        proxy_connect_timeout 2s;
        proxy_send_timeout 10s;
        proxy_read_timeout 15s;
        proxy_next_upstream off;
    }
}
