name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  linux:
    name: tests and build (gcc / glibc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install sqlite headers
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - name: Unit tests
        run: ./eat test
      - name: Build
        run: ./eat build
      - name: Installation
        run: python3 tests/installation.py
      - name: Load
        run: python3 tests/load.py --seconds 5 --output "$RUNNER_TEMP/load.json"

  macos:
    name: tests and build (clang)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Unit tests
        run: ./eat test
      - name: Build
        run: ./eat build
      - name: Installation
        run: python3 tests/installation.py
      - name: Load
        run: python3 tests/load.py --seconds 5 --output "$RUNNER_TEMP/load.json"

  musl:
    name: static build (gcc / musl)
    runs-on: ubuntu-latest
    container: alpine:3.18
    steps:
      - name: Install toolchain
        run: apk add --no-cache gcc musl-dev bash sqlite-static sqlite-dev tar python3
      - uses: actions/checkout@v5
      - name: Unit tests
        run: ./eat test
      - name: Static build
        run: |
          EXTRA_CFLAGS="-static -Os" EXTRA_LDFLAGS="-Wl,--gc-sections -s" ./eat build
          ls -la .build/server

  sanitizers:
    name: address and undefined behavior sanitizers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y clang libsqlite3-dev python3
      - name: Full suite with sanitizers
        env:
          CC: clang
          EXTRA_CFLAGS: -O1 -g -fno-omit-frame-pointer -fsanitize=address,undefined -fno-sanitize-recover=all
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: halt_on_error=1
        run: ./eat test
      - name: Fuzz parsers
        env:
          CC: clang
        run: ./tests/fuzz.sh 20

  image:
    name: container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build image
        run: docker build --build-arg PACK=0 -t gargantua .
      - name: Report size
        run: docker images --format '{{.Repository}}:{{.Tag}} {{.Size}}' gargantua
